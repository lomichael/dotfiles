# prefix / leader
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload
unbind r
bind r source-file ~/.tmux.conf

# sensible
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g set-clipboard on

# window naming
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# vim mode
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- splits & windows inherit cwd ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- catppuccin latte palette ---
# base=#eff1f5, mantle=#e6e9ef, surface0=#ccd0da, text=#4c4f69, overlay0=#9ca0b0
# yellow=#df8e1d, green=#40a02b, teal=#179299, peach=#fe640b
set -g status-style "bg=#e6e9ef,fg=#4c4f69"
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

# left: session name
set -g status-left "#[fg=#eff1f5,bg=#df8e1d,bold] #S #[fg=#df8e1d,bg=#e6e9ef,nobold] "

# window tabs: number + directory name
setw -g window-status-format "#[fg=#9ca0b0] #I:#W "
setw -g window-status-current-format "#[fg=#eff1f5,bg=#179299,bold] #I:#W #[fg=#179299,bg=#e6e9ef,nobold]"
setw -g window-status-separator ""

# right: git branch + time
set -g status-right "#[fg=#9ca0b0]#{?#{!=:#{pane_current_command},zsh}, #{pane_current_command} |,} #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#4c4f69,bg=#ccd0da] %H:%M "

# pane borders
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#179299"

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
