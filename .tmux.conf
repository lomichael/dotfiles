# prefix / leader
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload
unbind r
bind r source-file ~/.tmux.conf

# sensible
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g set-clipboard on

# window naming
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# vim mode
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- splits & windows inherit cwd ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- gruvbox-material palette ---
# bg=235 (#282828), bg1=237 (#3c3836), fg=223 (#ebdbb2)
# yellow=214 (#fabd2f), green=142 (#b8bb26), aqua=108 (#83a598)
# orange=208 (#fe8019), red=167 (#fb4934), gray=245 (#928374)

set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

# left: session name
set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#3c3836,nobold] "

# window tabs: number + directory name
setw -g window-status-format "#[fg=#928374] #I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=#83a598,bold] #I:#W #[fg=#83a598,bg=#3c3836,nobold]"
setw -g window-status-separator ""

# right: git branch + time
set -g status-right "#[fg=#928374]#{?#{!=:#{pane_current_command},zsh}, #{pane_current_command} |,} #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#ebdbb2,bg=#504945] %H:%M "

# pane borders
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
