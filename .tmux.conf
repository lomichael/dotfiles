# prefix / leader
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload
unbind r
bind r source-file ~/.tmux.conf

# sensible
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g set-clipboard on

# window naming
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# vim mode
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- splits & windows inherit cwd ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- selenized light palette ---
# bg0=#fbf3db, bg1=#e9e4d0, fg=#3a4d53, dim=#909995
# yellow=#ad8900, green=#489100, cyan=#009c8f, orange=#c25d1e
set -g status-style "bg=#e9e4d0,fg=#3a4d53"
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

# left: session name
set -g status-left "#[fg=#fbf3db,bg=#ad8900,bold] #S #[fg=#ad8900,bg=#e9e4d0,nobold] "

# window tabs: number + directory name
setw -g window-status-format "#[fg=#909995] #I:#W "
setw -g window-status-current-format "#[fg=#fbf3db,bg=#009c8f,bold] #I:#W #[fg=#009c8f,bg=#e9e4d0,nobold]"
setw -g window-status-separator ""

# right: git branch + time
set -g status-right "#[fg=#909995]#{?#{!=:#{pane_current_command},zsh}, #{pane_current_command} |,} #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#3a4d53,bg=#cfcebe] %H:%M "

# pane borders
set -g pane-border-style "fg=#cfcebe"
set -g pane-active-border-style "fg=#009c8f"

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
